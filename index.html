<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduHelp - Community</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">  <!-- Header -->  <header class="bg-blue-600 text-white p-6 text-center shadow">
    <h1 class="text-3xl font-bold">EduHelp 💬</h1>
    <p class="mt-2">Students helping students worldwide</p>
  </header>  <!-- Search Bar -->  <section class="max-w-2xl mx-auto mt-6 relative">
    <span class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400">🔍</span>
    <input id="search" type="text" placeholder="Search posts..." 
      class="w-full p-3 pl-10 border rounded-xl shadow focus:outline-none focus:ring-2 focus:ring-blue-400" />
  </section>  <!-- Create Post -->  <section class="max-w-2xl mx-auto mt-6 bg-white p-6 rounded-2xl shadow">
    <h2 class="text-xl font-bold mb-4">Create a Post</h2>
    <input id="title" type="text" placeholder="Title (e.g. I don't understand algebra)" 
      class="w-full p-3 border rounded mb-3" />
    <textarea id="content" placeholder="Explain your problem..." 
      class="w-full p-3 border rounded mb-4"></textarea>
    <button onclick="createPost()" 
      class="bg-blue-600 text-white px-4 py-2 rounded-xl w-full hover:bg-blue-700">
      Post
    </button>
  </section>  <!-- Posts Feed -->  <section id="posts" class="max-w-2xl mx-auto mt-8 space-y-6"></section>  <script>
    let allPosts = [];

    // Créer un post
    function createPost() {
      const title = document.getElementById("title").value.trim();
      const content = document.getElementById("content").value.trim();
      if (!title || !content) { alert("Please fill all fields"); return; }

      const postData = { title, content, replies: [] };
      allPosts.unshift(postData);
      addPostToDOM(postData, 0);

      document.getElementById("title").value = "";
      document.getElementById("content").value = "";
    }

    // Ajouter un post directement au DOM
    function addPostToDOM(postData, index) {
      const container = document.getElementById("posts");
      const post = document.createElement("div");
      post.className = "bg-white p-5 rounded-2xl shadow mb-4";

      post.innerHTML = `
        <h3 class="text-lg font-bold">${postData.title}</h3>
        <p class="mt-2">${postData.content}</p>
        <button onclick="toggleReplyBox(${index})" class="text-blue-600 mt-3">Reply</button>
        <div id="replyBox-${index}" class="mt-3 hidden">
          <textarea id="replyInput-${index}" placeholder="Write a reply..." class="w-full p-2 border rounded"></textarea><button onclick="addReply(${index})" class="mt-2 bg-blue-500 text-white px-3 py-1 rounded">Send</button>
    </div>
    <div class="replies mt-4 space-y-2"></div>
  `;

  container.prepend(post);
}

// Toggle reply box
function toggleReplyBox(index) {
  document.getElementById(`replyBox-${index}`).classList.toggle("hidden");
}

// Ajouter reply
function addReply(index) {
  const input = document.getElementById(`replyInput-${index}`);
  const text = input.value.trim();
  if (!text) return;

  allPosts[index].replies.push(text);
  const repliesDiv = document.getElementById(`replyBox-${index}`).nextElementSibling;
  const replyEl = document.createElement("div");
  replyEl.className = "bg-gray-100 p-3 rounded mt-2";
  replyEl.innerText = text;
  repliesDiv.appendChild(replyEl);
}

// Recherche live type TikTok
document.getElementById("search").addEventListener("input", function() {
  const query = this.value.toLowerCase();
  const posts = document.getElementById("posts").children;
  for (let i = 0; i < posts.length; i++) {
    const title = posts[i].querySelector("h3").innerText.toLowerCase();
    const content = posts[i].querySelector("p").innerText.toLowerCase();
    posts[i].style.display = (title.includes(query) || content.includes(query)) ? "block" : "none";
  }
});

  </script></body>
</html>
